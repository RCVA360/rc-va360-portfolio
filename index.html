<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RC.VA360 | Remote Operations & Virtual Support</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-rose: #D9A7A0;
      --secondary-sage: #A8B09A;
      --text-charcoal: #2E3A3F;
      --text-muted: #536269;
      --bg-cream: #F8F6F1;
      --card-white: #FFFFFF;
      --border-color: #E8E5DD;
      --tint-sage: #F2F5F0;
      --tint-rose: #FAF2F0;

      --font-heading: 'Montserrat', sans-serif;
      --font-subheading: 'Poppins', sans-serif;
      --font-body: 'Open Sans', sans-serif;
      --font-editorial: 'Cormorant Garamond', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background:
        radial-gradient(circle at top left, rgba(217,167,160,0.14), transparent 28%),
        radial-gradient(circle at bottom right, rgba(168,176,154,0.16), transparent 30%),
        var(--bg-cream);
      color: var(--text-charcoal);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      max-width: 1200px;
      margin: 2rem auto 4rem;
      background: var(--card-white);
      border-radius: 24px;
      border: 1px solid var(--border-color);
      box-shadow: 0 16px 40px rgba(46,58,63,0.07);
      overflow: hidden;
      position: relative;
      perspective: 1700px;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 3rem;
      border-bottom: 1px solid var(--border-color);
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .brand-group { display: flex; align-items: center; text-decoration: none; }
    .brand-logo-img { max-height: 52px; width: auto; display: block; filter: drop-shadow(0 10px 18px rgba(46,58,63,0.08)); }

    .nav-links { display: flex; gap: 1.75rem; align-items: center; list-style: none; }
    .nav-links a {
      text-decoration: none;
      font-family: var(--font-subheading);
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text-charcoal);
      transition: color 0.2s ease, transform 0.2s ease;
    }
    .nav-links a:hover { color: var(--primary-rose); transform: translateY(-1px); }

    .btn-nav {
      background: var(--secondary-sage);
      color: #fff !important;
      padding: 0.6rem 1.4rem;
      border-radius: 30px;
      font-weight: 600 !important;
      box-shadow: 0 10px 22px rgba(168,176,154,0.28);
      transition: all 0.2s ease !important;
    }
    .btn-nav:hover { background: #919a83 !important; transform: translateY(-2px) scale(1.01); }

    .hero-section {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 3.5rem;
      align-items: center;
      padding: 4.5rem 3.5rem 3rem;
      background: radial-gradient(circle at top right, var(--tint-rose) 0%, transparent 65%);
      border-bottom: 1px solid var(--border-color);
      transform-style: preserve-3d;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(242,245,240,0.9);
      border: 1px solid rgba(168,176,154,0.8);
      color: var(--text-charcoal);
      padding: 0.35rem 0.95rem;
      border-radius: 50px;
      font-size: 0.8rem;
      font-family: var(--font-subheading);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 1.25rem;
      box-shadow: 0 8px 18px rgba(168,176,154,0.12);
    }
